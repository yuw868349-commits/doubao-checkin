[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doubao-checkin"
version = "0.1.1"
description = "Automate the daily check-in on Doubao's credit page."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "yuw868349-commits"}]
keywords = ["doubao", "checkin", "playwright", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.40",
    "pycryptodome>=3.19",
]

[project.urls]
Homepage = "https://github.com/yuw868349-commits/doubao-checkin"
Issues = "https://github.com/yuw868349-commits/doubao-checkin/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
doubao-checkin = "doubao_checkin.cli:main"

[tool.setuptools.packages.find]
include = ["doubao_checkin*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
