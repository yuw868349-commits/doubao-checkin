[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doubao-checkin"
dynamic = ["version"]
description = "Automate the daily check-in on Doubao's credit page."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "yuw868349-commits"}]
keywords = ["doubao", "checkin", "playwright", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.40,<2",
    "pycryptodome>=3.19,<4",
]

[project.urls]
Homepage = "https://github.com/yuw868349-commits/doubao-checkin"
Issues = "https://github.com/yuw868349-commits/doubao-checkin/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "build>=1.2,<2",
    "twine>=5,<7",
]

[project.scripts]
doubao-checkin = "doubao_checkin.cli:main"

[tool.setuptools.packages.find]
include = ["doubao_checkin*"]

[tool.setuptools.dynamic]
version = {attr = "doubao_checkin.__version__"}

[tool.setuptools.package-data]
doubao_checkin = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "PTH", "RET", "SIM", "C4", "ARG"]
ignore = [
    "E501",   # 行宽交给格式化
    "S101",   # 测试里就是要 assert
    "S603",   # subprocess 参数是固定的，没有 shell
    "S607",   # esentutl / security 走 PATH 是预期行为
    "RET504", # 先赋值再 return 有时更好读
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "E402", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.10"
files = ["doubao_checkin"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: 需要 Playwright Chromium 的集成测试"]

[tool.coverage.run]
source = ["doubao_checkin"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
