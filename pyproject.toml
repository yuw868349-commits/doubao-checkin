[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doubao-checkin"
version = "0.1.0"
description = "Automate the daily check-in on Doubao's credit page."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "yuw868349-commits"}]
dependencies = [
    "playwright>=1.40",
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
doubao-checkin = "doubao_checkin.cli:main"

[tool.setuptools.packages.find]
include = ["doubao_checkin*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
