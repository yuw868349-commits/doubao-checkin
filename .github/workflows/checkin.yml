name: 每日签到

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doubao-checkin
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run check-in
        env:
          DOUBAO_COOKIES_JSON: ${{ secrets.DOUBAO_COOKIES_JSON }}
        run: |
          if [ -z "$DOUBAO_COOKIES_JSON" ]; then
            echo "::error::DOUBAO_COOKIES_JSON 没有配置，签到没有执行。"
            exit 1
          fi
          python checkin.py run --json
      - name: Write summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          path = pathlib.Path("data/last-result.json")
          print("## 豆包签到\n")
          if not path.exists():
              print("没有生成结果文件，检查上一步日志。")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              print("| 字段 | 值 |")
              print("| --- | --- |")
              for key in ("result", "report", "mode", "detail", "saved_at", "duration_ms"):
                  print(f"| {key} | {data.get(key)} |")
          PY
